<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Maquette n°4 (v4) : light theme + retours de 2026-11-06 PM :
     titre à gauche complète, chip "attends ta réponse" à droite du titre ; pills de bruit supprimées
     (tags/canal/confiance-texte) — la confiance devient un point coloré muet sur la barre de progression ;
     livraison rendue INLINE dans la carte (graphique + explication sommaire) : on évite OpenChamber pour le résultat. -->
<style>
  :root {
    --bg:#f4f5f4; --card:#fff; --border:#e4e7e4; --text:#1d211e; --muted:#7c847d;
    --green:#2b9f6a; --green-soft:#e3f2ea; --orange:#d97a2b; --amber:#d19a2f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding:20px 26px; font-size:13.5px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .brand { display:flex; align-items:center; gap:9px; }
  .logo { width:26px; height:26px; border-radius:7px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; }
  h1 { font-size:15px; font-weight:700; }
  .bar { background:var(--card); border:1px solid var(--border); border-radius:10px; }
  .bar input { width:100%; background:transparent; border:none; outline:none; font-family:inherit; font-size:14px; color:var(--text); padding:12px 14px; }
  .bar input::placeholder { color:#a5aca5; }
  .seclabel { display:flex; align-items:center; gap:8px; margin:18px 0 9px; font-size:12px; font-weight:700; letter-spacing:.02em; }
  .sdot { width:8px; height:8px; border-radius:50%; }
  .sdot.g { background:var(--green); } .sdot.gg { background:var(--green); opacity:.4; }
  .cnt { background:var(--card); border:1px solid var(--border); border-radius:9px; font-size:10.5px; font-weight:600; padding:1px 8px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:11px; padding:11px 13px 10px; margin-bottom:9px; }
  .r1 { display:flex; align-items:center; gap:9px; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.g { background:var(--green); } .dot.o { background:var(--orange); animation:blink 1.5s infinite; } .dot.gg { background:var(--green); opacity:.45; }
  @keyframes blink { 50% { opacity:.35; } }
  .title { font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { font-size:10.5px; border-radius:9px; padding:2px 9px; white-space:nowrap; flex-shrink:0; }
  .chip.warn { background:var(--orange); color:#fff; font-weight:600; }
  .sp { flex:1; }
  .ocbtn { flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; color:var(--muted); border-radius:6px; cursor:pointer; }
  .ocbtn:hover { color:var(--green); background:var(--green-soft); }
  .brief { margin-top:5px; font-size:12px; color:var(--muted); padding-right:26px; }
  .bars { margin-top:8px; display:flex; align-items:center; gap:10px; }
  .track { height:5px; border-radius:3px; background:#eceeed; flex:1; overflow:hidden; }
  .fill { height:100%; background:var(--green); transition:width .5s; }
  .fill.mid { background:var(--amber); }
  .cdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; opacity:.85; }
  .pct { font-size:11px; font-weight:650; width:30px; text-align:right; font-variant-numeric:tabular-nums; }
  .qbox { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .qtext { font-size:13px; line-height:1.45; margin-bottom:9px; }
  .actions { display:flex; gap:7px; align-items:center; }
  .bin { font-family:inherit; background:var(--green); color:#fff; border:none; border-radius:7px; font-size:12px; font-weight:600; padding:7px 14px; cursor:pointer; white-space:nowrap; }
  .bin.gh { background:#fff; color:var(--text); border:1px solid var(--border); font-weight:500; }
  .actions input, .draftf { flex:1; background:#f7f8f7; border:1px solid var(--border); border-radius:7px; font-family:inherit; font-size:12.5px; color:var(--text); padding:7px 10px; outline:none; min-width:0; }
  .actions input:focus, .draftf:focus { border-color:var(--green); }
  .draftf { width:100%; margin-bottom:8px; min-height:44px; resize:none; line-height:1.45; display:block; }
  .arrowbtn { background:var(--green); color:#fff; border:none; border-radius:7px; width:30px; height:29px; cursor:pointer; font-size:12px; flex-shrink:0; }
  .render { margin-top:10px; background:#fbfcfb; border:1px solid var(--border); border-radius:9px; padding:10px 12px; }
  .render h3 { font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .render .exp { font-size:12px; line-height:1.5; margin-top:8px; }
  .render .exp b { font-weight:600; }
  .donebox { margin-top:9px; padding-top:9px; border-top:1px solid var(--border); display:flex; gap:7px; align-items:center; }
  .donebox input { flex:1; background:#f7f8f7; border:1px solid var(--border); border-radius:7px; font-family:inherit; font-size:12px; color:var(--text); padding:7px 10px; outline:none; min-width:0; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#20241f; color:#fff; font-size:12.5px; border-radius:9px; padding:9px 16px; opacity:0; transition:opacity .3s; pointer-events:none; }
  @keyframes born { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .card.born { animation:born .4s ease; }
</style>
</head>
<body>

<div class="hdr">
  <div class="brand"><div class="logo">◉</div><h1>Superviseur</h1></div>
</div>

<div class="bar"><input id="bar" placeholder="Une demande ? Tape ta demande, Entrée." autocomplete="off"></div>

<div class="seclabel"><span class="sdot g"></span>EN COURS<span class="cnt" id="cr">0</span></div>
<div id="sr"></div>
<div class="seclabel"><span class="sdot gg"></span>LIVRÉS<span class="cnt" id="cd">0</span></div>
<div id="sd"></div>
<div id="toast"></div>

<script>
const R=document.getElementById('sr'), D=document.getElementById('sd');
const bar=document.getElementById('bar'), toastEl=document.getElementById('toast'); let tt;
function toast(m){ toastEl.textContent=m; toastEl.style.opacity=1; clearTimeout(tt); tt=setTimeout(()=>toastEl.style.opacity=0,2200); }
function count(){ cr.textContent=R.children.length; cd.textContent=D.children.length; }
const cr=document.getElementById('cr'), cd=document.getElementById('cd');
const SVG_OC='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';

function card(title,{brief='',prog=0,conf=2}={}){
  const c=document.createElement('div'); c.className='card born';
  c.innerHTML=`<div class="r1"><span class="dot g"></span><span class="title"></span><span class="sp"></span>
      <button class="ocbtn" title="Ouvrir dans OpenChamber">${SVG_OC}</button></div>
    <div class="brief"></div>
    <div class="bars"><span class="track"><span class="fill"></span></span><span class="cdot"></span><span class="pct"></span></div>
    <div class="qbox" style="display:none"></div>
    <div class="render" style="display:none"></div>
    <div class="donebox" style="display:none"></div>`;
  c._dot=c.querySelector('.dot'); c._t=c.querySelector('.title'); c._b=c.querySelector('.brief');
  c._fill=c.querySelector('.fill'); c._pct=c.querySelector('.pct'); c._cd=c.querySelector('.cdot');
  c._q=c.querySelector('.qbox'); c._rd=c.querySelector('.render'); c._dn=c.querySelector('.donebox'); c._r1=c.querySelector('.r1');
  c._t.textContent=title; if(brief) c._b.textContent=brief;
  c.querySelector('.ocbtn').onclick=()=>toast('Ouverture dans OpenChamber — '+title);
  c.setProg=v=>{ c._fill.style.width=v+'%'; c._pct.textContent=Math.round(v)+'%'; c._fill.classList.toggle('mid', v>0&&v<66); };
  c.setConf=l=>{ c._cd.style.background=['#d95f5f','#d19a2f','#2b9f6a'][l]; c._cd.title='Confiance '+['basse','moyenne','haute'][l]; };
  c.setProg(prog); c.setConf(conf);
  return c;
}

function warnChip(c){ const w=document.createElement('span'); w.className='chip warn'; w.textContent='attends ta réponse'; c._r1.insertBefore(w, c._r1.querySelector('.sp')); return w; }

function toAttention(c,{question=null,binary=false,compose=null,onSend=null}={}){
  c._dot.className='dot o'; const w=warnChip(c);
  const q=document.createElement('div');
  if(compose){ const ta=document.createElement('textarea'); ta.className='draftf'; ta.value=compose; q.appendChild(ta); }
  else { const qt=document.createElement('div'); qt.className='qtext'; qt.textContent=question; q.appendChild(qt); }
  const act=document.createElement('div'); act.className='actions';
  if(binary&&!compose){ const y=document.createElement('button'); y.className='bin'; y.textContent='Oui'; act.appendChild(y);
    const n=document.createElement('button'); n.className='bin gh'; n.textContent='Non'; act.appendChild(n); }
  const inp=document.createElement('input'); inp.type='text'; inp.placeholder=compose?'… corrige librement':'… ou répond autre chose'; act.appendChild(inp);
  const go=document.createElement('button'); go.className='arrowbtn'; go.textContent='➤'; act.appendChild(go);
  q.appendChild(act);
  const finish=res=>{ c._dot.className='dot g'; q.remove(); w.remove(); R.prepend(c); count(); if(res) c._b.textContent=res; };
  const handle=raw=>{ if(onSend) onSend(raw,finish,c); else finish(raw? 'ta réponse : « '+raw.slice(0,34)+' » — reprise' : null); };
  go.onclick=()=>handle(inp.value.trim()||compose);
  inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()) handle(inp.value.trim()); };
  if(binary&&!compose){ const b=q.querySelectorAll('.bin'); b[0].onclick=()=>handle('oui'); b[1].onclick=()=>handle('non'); }
  c._q.innerHTML=''; c._q.appendChild(q); c._q.style.display='block';
  R.insertBefore(c, R.firstChild); count();
}

function toDone(c,{livraison=null,render=null}={}){
  c._dot.className='dot gg'; warnChipAC(c);
  function warnChipAC(x){ const w=x._r1.querySelector('.chip.warn'); if(w) w.remove(); }
  if(livraison) c._b.textContent=livraison;
  c.setProg(100); c.setConf(2);
  if(render){ c._rd.innerHTML=render; c._rd.style.display='block'; }
  const db=c._dn; db.style.display='flex'; db.innerHTML='';
  const inp=document.createElement('input'); inp.placeholder='… ou repartir sur quoi ?';
  const go=document.createElement('button'); go.className='bin'; go.textContent='Repartir ⏎';
  inp.onkeydown=e=>{ if(e.key==='Enter'&&inp.value.trim()){ R.prepend(spawn(c._t.textContent+' — suite',{brief:'repars : '+inp.value.trim().slice(0,34),prog:5})); count(); } };
  go.onclick=()=>inp.onkeydown({key:'Enter'});
  const term=document.createElement('button'); term.className='bin gh'; term.textContent='Terminer';
  term.onclick=()=>{ c.style.transition='opacity .4s'; c.style.opacity=0; setTimeout(()=>{c.remove(); count();},400); };
  db.append(inp,go,term);
  D.append(c); count();
}

function chartHTML(){
  const data=[['mai',41],['juin',52],['juil',47],['août',38],['sept',64],['oct',78],['nov',92],['déc',113]];
  const max=120, W=520, H=120, bw=34, gap=(W-40-8*bw)/7;
  let bars='', labels='';
  data.forEach((d,i)=>{ const h=d[1]/max*(H-30), x=22+i*(bw+gap), y=H-18-h;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${d[1]>70?'#2b9f6a':'#b9d9c9'}"/>
           <text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="8.5" fill="#7c847d" font-family="inherit">${d[1]}k</text>`;
    labels+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#7c847d">${d[0]}</text>`; });
  return `<h3>Utilisation produits — 8 derniers mois (sessions / mois)</h3>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:560px; display:block;" role="img">${bars}${labels}</svg>
    <div class="exp"><b>Tendance :</b> +176 % depuis mai, accélération nette depuis septembre. <b>Décembre</b> plus haut (113k) — porté par la mise en ligne des 2 nouveaux produits. <b>Août</b>, seul creux, coïncide avec les congés.</div>`;
}

function spawn(title,{brief,prog=8,conf=1,then=null,delay=3500}={}){
  const c=card(title,{brief:brief||'démarrage — le goal se rédige',prog,conf});
  R.prepend(c); count();
  if(then) setTimeout(()=>then(c), delay);
  return c;
}

/* flotte initiale */
const chart=spawn('Usage produits — graphique',{brief:'génère le graphique des 8 derniers mois',prog:65,conf:1});
const bug=spawn('Bug facturation',{brief:'Reproduit : total HT faux avec TVA 5,5 %',prog:55,conf:1});

setTimeout(()=>toDone(chart,{render:chartHTML()}),4200);
setTimeout(()=>toAttention(bug,{binary:true,question:'Je garde la TVA à 5,5 % dans le jeu d\u2019essai, ou je passe au taux réel ?',
  onSend:(v,fin)=>{ fin('ta décision : '+v+' — reprise des tests'); bug.setProg(75); bug.setConf(2); }}),6500);

bar.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!bar.value.trim()) return;
  const v=bar.value.trim(); bar.value='';
  const isMax=/max|absent|meeting/i.test(v);
  spawn(isMax?'Message à Max':v.slice(0,30)+(v.length>30?'…':''),{
    brief:isMax?'rédige le message':'démarrage — le goal se rédige',prog:8,conf:2,then:c=>toAttention(c,{binary:false,
      question:isMax?'Message prêt à envoyer ?':'C\u2019est parti. Une précision avant d\u2019aller loin ?',
      compose:isMax?'Salut Max, je serai absent au meeting d\u2019aujourd\u2019hui, on se recalle demain. Bonne réunion !':null,
      onSend:isMax?(t,fin)=>{ fin('envoyé'); setTimeout(()=>toDone(c,{livraison:'message envoyé à Max'}),700); }:null}),delay:isMax?2200:3800});
});
</script>

</body>
</html>
